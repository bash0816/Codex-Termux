          SITE4_NEW = '''        match OpenOptions::new().read(true).write(true).open(path) {
                      #[cfg(target_os = "android")]
                      Ok(file) => match android_try_flock_exclusive(&file) {
                          Ok(true) => Ok(Some(coordination_lock)),
