          echo '=== workspace openssl references ==='
          grep -r 'openssl\|native-tls' --include=Cargo.toml . | grep -v 'target/' | grep -v '.cargo/' || true

      - name: Install clippy
        run: |
          set -euo pipefail
          cd source-repo/codex-rs
          rustup component add clippy --toolchain "${RUST_VERSION}"
          cargo +"${RUST_VERSION}" clippy --version

      - name: Prepare clippy config with file-lock disallowed methods
        run: |
          set -euo pipefail
          mkdir -p /tmp/clippy-conf
          cp source-repo/codex-rs/clippy.toml /tmp/clippy-conf/clippy.toml
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("/tmp/clippy-conf/clippy.toml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          hits = [i for i, line in enumerate(lines) if line.startswith("disallowed-methods = [")]
          assert len(hits) == 1, f"expected exactly one 'disallowed-methods = [' line, found {len(hits)}"
          start = hits[0]
          methods = [
              "std::fs::File::lock",
              "std::fs::File::lock_shared",
              "std::fs::File::try_lock",
              "std::fs::File::try_lock_shared",
              "std::fs::File::unlock",
          ]
          entries = [f'    {{ path = "{m}", reason = "codex-termux-file-lock" }},\n' for m in methods]
          lines[start + 1:start + 1] = entries
          path.write_text("".join(lines), encoding="utf-8")
          print("clippy.toml lines around the insertion:")
          for n in range(max(start - 2, 0), min(start + len(entries) + 3, len(lines))):
              print(f"{n + 1}: {lines[n].rstrip()}")
          PY

      - name: Clippy stage 1 (unpatched file-lock sites)
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          set -uo pipefail
          cd source-repo/codex-rs
          start=$(date +%s)
          set +e
          CLIPPY_CONF_DIR=/tmp/clippy-conf cargo +"${RUST_VERSION}" clippy \
            -p codex-cli -p codex-exec -p codex-code-mode-host \
            --target "${ANDROID_TARGET}" --locked \
            --message-format=json \
            -- --force-warn clippy::disallowed_methods --cap-lints warn \
            > /tmp/clippy-stage1.jsonl 2> /tmp/clippy-stage1.stderr
          status=$?
          set -e
          end=$(date +%s)
          echo "$status" > /tmp/clippy-stage1.status
          echo "stage 1 clippy exit status: ${status} (elapsed $((end - start))s)"
          echo "stderr tail:"
          tail -n 20 /tmp/clippy-stage1.stderr

      - name: Extract stage 1 disallowed-methods sites
        run: |
          set -euo pipefail
          cat > /tmp/extract_lock_sites.py <<'PY'
          import json
          import sys

          src, dst = sys.argv[1], sys.argv[2]
          seen = set()
          sites = []
          with open(src, encoding="utf-8") as fh:
              for raw in fh:
                  raw = raw.strip()
                  if not raw.startswith("{"):
                      continue
                  msg = json.loads(raw)
                  if msg.get("reason") != "compiler-message":
                      continue
                  diag = msg["message"]
                  if (diag.get("code") or {}).get("code") != "clippy::disallowed_methods":
                      continue
                  for span in diag.get("spans", []):
                      if not span.get("is_primary"):
                          continue
                      key = (span["file_name"], span["line_start"], span["column_start"])
                      if key in seen:
                          continue
                      seen.add(key)
                      sites.append({
                          "file": span["file_name"],
                          "line": span["line_start"],
                          "column": span["column_start"],
                          "message": diag.get("message", ""),
                      })
          sites.sort(key=lambda s: (s["file"], s["line"], s["column"]))
          with open(dst, "w", encoding="utf-8") as fh:
              json.dump(sites, fh, indent=2, ensure_ascii=False)
          print(f"{len(sites)} disallowed_methods site(s) written to {dst}")
          for s in sites:
              print(f"  {s['file']}:{s['line']}:{s['column']}  {s['message']}")
          PY
          python3 -I /tmp/extract_lock_sites.py /tmp/clippy-stage1.jsonl /tmp/lock-sites-stage1.json

      - name: Inject file-lock probes (deep, expect-gated, path reference)
        run: |
          set -euo pipefail
          cd source-repo/codex-rs
          python3 - <<'PY'
          import json
          import pathlib

          probes = [
              {
                  "kind": "deep",
                  "file": "login/src/auth/storage.rs",
                  "token": "    file.lock()",
                  "body": (
                      "\n// spike-clippy-file-lock-gate probe (deep): method-call form\n"
                      "#[doc(hidden)]\n"
                      "pub fn __spike_file_lock_probe_deep(file: &std::fs::File) -> std::io::Result<()> {\n"
                      "    file.lock()\n"
                      "}\n"
                  ),
              },
              {
                  "kind": "expect",
                  "file": "state/src/sqlite.rs",
                  "token": "    file.lock_shared()",
                  "body": (
                      "\n// spike-clippy-file-lock-gate probe (expect): method-call form in a module with a file-level expect\n"
                      "#[doc(hidden)]\n"
                      "pub fn __spike_file_lock_probe_expect(file: &std::fs::File) -> std::io::Result<()> {\n"
                      "    file.lock_shared()\n"
                      "}\n"
                  ),
              },
              {
                  "kind": "path",
                  "file": "message-history/src/lib.rs",
                  "token": "    std::fs::File::unlock",
                  "body": (
                      "\n// spike-clippy-file-lock-gate probe (path): function-path reference form\n"
                      "#[doc(hidden)]\n"
                      "pub fn __spike_file_lock_probe_path() -> fn(&std::fs::File) -> std::io::Result<()> {\n"
                      "    std::fs::File::unlock\n"
                      "}\n"
                  ),
              },
          ]

          records = []
          for probe in probes:
              path = pathlib.Path(probe["file"])
              assert path.is_file(), f"missing file: {probe['file']}"
              text = path.read_text(encoding="utf-8")
              if probe["kind"] == "expect":
                  assert "#![expect(clippy::disallowed_methods)]" in text, f"expect marker not found in {probe['file']}"
              if not text.endswith("\n"):
                  text += "\n"
              base = text.count("\n")
              text += probe["body"]
              path.write_text(text, encoding="utf-8")
              lines = text.splitlines()
              token_line = None
              for idx in range(base, len(lines)):
                  if lines[idx] == probe["token"]:
                      token_line = idx + 1
                      break
              assert token_line is not None, f"probe token not found in {probe['file']}"
              records.append({"kind": probe["kind"], "file": probe["file"], "line": token_line})

          pathlib.Path("/tmp/injections.json").write_text(json.dumps(records, indent=2), encoding="utf-8")
          for r in records:
              print(f"injected {r['kind']}: {r['file']}:{r['line']}")
          PY

      - name: Clippy stage 1b (with injected probes)
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          set -uo pipefail
          cd source-repo/codex-rs
          start=$(date +%s)
          set +e
          CLIPPY_CONF_DIR=/tmp/clippy-conf cargo +"${RUST_VERSION}" clippy \
            -p codex-cli -p codex-exec -p codex-code-mode-host \
            --target "${ANDROID_TARGET}" --locked \
            --message-format=json \
            -- --force-warn clippy::disallowed_methods --cap-lints warn \
            > /tmp/clippy-stage1b.jsonl 2> /tmp/clippy-stage1b.stderr
          status=$?
          set -e
          end=$(date +%s)
          echo "$status" > /tmp/clippy-stage1b.status
          echo "stage 1b clippy exit status: ${status} (elapsed $((end - start))s)"
          echo "stderr tail:"
          tail -n 20 /tmp/clippy-stage1b.stderr

      - name: Extract stage 1b sites and report injection detection
        run: |
          set -euo pipefail
          python3 -I /tmp/extract_lock_sites.py /tmp/clippy-stage1b.jsonl /tmp/lock-sites-stage1b.json
          python3 - <<'PY'
          import json
          import pathlib

          def load(p):
              return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))

          def key(s):
              return (s["file"], s["line"], s["column"])

          s1 = load("/tmp/lock-sites-stage1.json")
          s1b = load("/tmp/lock-sites-stage1b.json")
          k1 = {key(s) for s in s1}
          k1b = {key(s) for s in s1b}
          st1 = pathlib.Path("/tmp/clippy-stage1.status").read_text(encoding="utf-8").strip()
          st1b = pathlib.Path("/tmp/clippy-stage1b.status").read_text(encoding="utf-8").strip()
          errors1b = 0
          for raw in pathlib.Path("/tmp/clippy-stage1b.jsonl").read_text(encoding="utf-8").splitlines():
              if raw.startswith("{"):
                  msg = json.loads(raw)
                  if msg.get("reason") == "compiler-message" and msg["message"].get("level") == "error":
                      errors1b += 1
          lines = [
              f"clippy exit status: stage1={st1} stage1b={st1b}",
              f"compiler error messages in stage1b: {errors1b}",
              f"disallowed_methods sites: stage1={len(s1)} stage1b={len(s1b)}",
              "added in stage1b:",
          ]
          lines += [f"  + {k[0]}:{k[1]}:{k[2]}" for k in sorted(k1b - k1)]
          lines.append("removed in stage1b:")
          lines += [f"  - {k[0]}:{k[1]}:{k[2]}" for k in sorted(k1 - k1b)]
          for r in load("/tmp/injections.json"):
              hit = any(s["file"].endswith(r["file"]) and s["line"] == r["line"] for s in s1b)
              lines.append(f"INJECTION {r['kind']}: {'FOUND' if hit else 'MISSING'} ({r['file']}:{r['line']})")
          report = "\n".join(lines) + "\n"
          pathlib.Path("/tmp/clippy-report.txt").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-clippy-file-lock-gate-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/clippy-conf/clippy.toml
            /tmp/clippy-stage1.jsonl
            /tmp/clippy-stage1.stderr
            /tmp/clippy-stage1.status
            /tmp/clippy-stage1b.jsonl
            /tmp/clippy-stage1b.stderr
            /tmp/clippy-stage1b.status
            /tmp/lock-sites-stage1.json
            /tmp/lock-sites-stage1b.json
            /tmp/injections.json
            /tmp/clippy-report.txt
