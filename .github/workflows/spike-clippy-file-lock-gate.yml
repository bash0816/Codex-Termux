          EDITS_COMMON = [
              ("helper insertion", HELPER_ANCHOR, HELPERS),
              ("acquire try_lock site", SITE2_OLD, SITE2_NEW),
              ("remove_stale_thread_locks site", SITE3_OLD, SITE3_NEW),
              ("try_acquire_for_publication site", SITE4_OLD, SITE4_NEW),
          ]
          SITE1 = {"A": (SITE1_A_OLD, SITE1_A_NEW), "B": (SITE1_B_OLD, SITE1_B_NEW)}


          def counts(txt):
              res = {}
              res["lock_coordination site [A]"] = (txt.count(SITE1_A_OLD), txt.count(SITE1_A_NEW))
              res["lock_coordination site [B]"] = (txt.count(SITE1_B_OLD), txt.count(SITE1_B_NEW))
              for name, old, new in EDITS_COMMON:
                  res[name] = (txt.count(old), txt.count(new))
              return res


          def is_fresh(txt):
              oa, ob = txt.count(SITE1_A_OLD), txt.count(SITE1_B_OLD)
              na, nb = txt.count(SITE1_A_NEW), txt.count(SITE1_B_NEW)
              if (oa, ob) not in [(1, 0), (0, 1)]:
                  return None
              if na != 0 or nb != 0:
                  return None
              for _name, old, new in EDITS_COMMON:
                  if txt.count(old) != 1 or txt.count(new) != 0:
                      return None
              return "A" if oa == 1 else "B"


          def unapply(txt):
              na, nb = txt.count(SITE1_A_NEW), txt.count(SITE1_B_NEW)
              if (na, nb) not in [(1, 0), (0, 1)]:
                  return None
              for _name, _old, new in EDITS_COMMON:
                  if txt.count(new) != 1:
                      return None
              variant = "A" if na == 1 else "B"
              t = txt
              t = t.replace(SITE4_NEW, SITE4_OLD, 1)
              t = t.replace(SITE3_NEW, SITE3_OLD, 1)
              t = t.replace(SITE2_NEW, SITE2_OLD, 1)
              t = t.replace(SITE1[variant][1], SITE1[variant][0], 1)
              t = t.replace(HELPERS, HELPER_ANCHOR, 1)
              return t, variant


          def is_applied(txt):
              r = unapply(txt)
              if r is None:
                  return False
              t, variant = r
              return is_fresh(t) == variant


          v = is_fresh(txt)
          if v is not None:
              ordered = [
                  ("helper insertion", HELPER_ANCHOR, HELPERS),
                  ("lock_coordination site", SITE1[v][0], SITE1[v][1]),
                  ("acquire try_lock site", SITE2_OLD, SITE2_NEW),
                  ("remove_stale_thread_locks site", SITE3_OLD, SITE3_NEW),
                  ("try_acquire_for_publication site", SITE4_OLD, SITE4_NEW),
              ]
              for name, old, new in ordered:
                  assert txt.count(old) == 1, f"{name}: old pattern not unique after prior edits"
                  txt = txt.replace(old, new, 1)
              p.write_text(txt)
              print("Applied Android real-flock writer lock patch to writer_lock.rs (5/5 edits)")
              sys.exit(0)

          if is_applied(txt):
              print("writer_lock.rs Android real-flock patch already applied — skipping")
              sys.exit(2)

          for name, old, _new in EDITS_COMMON:
              count = txt.count(old)
              if count != 1:
                  print(
                      f"ERROR: unexpected upstream change in writer_lock.rs at '{name}' "
                      f"(expected exactly 1 occurrence of old pattern, found {count})",
                      file=sys.stderr,
                  )
          oa, ob = txt.count(SITE1_A_OLD), txt.count(SITE1_B_OLD)
          if (oa, ob) not in [(1, 0), (0, 1)]:
              print(
                  "ERROR: unexpected upstream change in writer_lock.rs at 'lock_coordination site' "
                  f"(expected exactly one of SITE1_A/SITE1_B to match once; found A={oa}, B={ob})",
                  file=sys.stderr,
              )
          for name, (o, n) in counts(txt).items():
              print(f"{name}: old={o} new={n}", file=sys.stderr)
          sys.exit(1)
          WLOCKPYEOF
          WLOCK_STATUS=$?
          set -e
          if [ "$WLOCK_STATUS" -eq 0 ]; then
            if ! grep -qF 'fn android_flock_exclusive_blocking' "$writer_lock_rs"; then
              echo "ERROR: Android flock shim not found in writer_lock.rs after patch" >&2
              exit 1
            fi
            if ! grep -qF 'fn android_try_flock_exclusive' "$writer_lock_rs"; then
              echo "ERROR: Android try_flock shim not found in writer_lock.rs after patch" >&2
              exit 1
            fi
            echo "Assertion passed: Android real-flock shims present in writer_lock.rs"
          elif [ "$WLOCK_STATUS" -eq 2 ]; then
            echo "Skipped: writer_lock.rs already patched"
          else
            exit "$WLOCK_STATUS"
          fi

          # Patch: add libc dependency to rollout crate (needed by the Android
          # real-flock shim above). Workspace already pins libc = "0.2.182".
          rollout_cargo="source-repo/codex-rs/rollout/Cargo.toml"
          set +e
          python3 - "$rollout_cargo" <<'ROLLOUTCARGOPYEOF'
          import sys
          import pathlib

          p = pathlib.Path(sys.argv[1])
          txt = p.read_text()

          # libc is only referenced from the Android-only flock() shim in
          # rollout/src/writer_lock.rs (see writer_lock.rs patch,
          # openai/codex#26277). Dependency ordering varies by version, so
          # insert it immediately after the codex-utils-path line.
          lines = txt.splitlines(keepends=True)

          def line_text(line):
              return line.removesuffix("\n").removesuffix("\r")

          section_start = next(
              (i for i, line in enumerate(lines) if line_text(line) == "[dependencies]"),
              None,
          )
          if section_start is None:
              print("ERROR: [dependencies] section not found in rollout/Cargo.toml", file=sys.stderr)
              sys.exit(1)

          section_end = next(
              (i for i in range(section_start + 1, len(lines)) if line_text(lines[i]).lstrip().startswith("[")),
              len(lines),
          )
          section = lines[section_start + 1:section_end]
          if any(line_text(line) == "libc = { workspace = true }" for line in section):
              print("rollout/Cargo.toml libc dependency already present — skipping")
              sys.exit(2)

          anchor = "codex-utils-path = { workspace = true }"
          anchor_indexes = [
              i for i in range(section_start + 1, section_end)
              if line_text(lines[i]) == anchor
          ]
          count = len(anchor_indexes)
          if count != 1:
              print(
                  f"ERROR: unexpected upstream change in rollout/Cargo.toml "
                  f"(expected exactly 1 occurrence of anchor, found {count})",
                  file=sys.stderr,
              )
              sys.exit(1)

          anchor_index = anchor_indexes[0]
          anchor_line = lines[anchor_index]
          if anchor_line.endswith("\r\n"):
              newline = "\r\n"
          elif anchor_line.endswith("\n"):
              newline = "\n"
          elif anchor_line.endswith("\r"):
              newline = "\r"
          else:
              newline = "\n"
          inserted = ("" if anchor_line.endswith(("\n", "\r")) else newline) + "libc = { workspace = true }" + (newline if anchor_line.endswith(("\n", "\r")) else "")
          lines.insert(anchor_index + 1, inserted)
          p.write_bytes("".join(lines).encode())
          print("Added libc workspace dependency to rollout/Cargo.toml")
          sys.exit(0)
          ROLLOUTCARGOPYEOF
          ROLLOUT_CARGO_STATUS=$?
          set -e
          if [ "$ROLLOUT_CARGO_STATUS" -eq 0 ]; then
            if ! grep -qF 'libc = { workspace = true }' "$rollout_cargo"; then
              echo "ERROR: libc dependency not found in rollout/Cargo.toml after patch" >&2
              exit 1
            fi
            echo "Assertion passed: libc dependency present in rollout/Cargo.toml"
          elif [ "$ROLLOUT_CARGO_STATUS" -eq 2 ]; then
            echo "Skipped: rollout/Cargo.toml already patched"
          else
            exit "$ROLLOUT_CARGO_STATUS"
          fi

      # Applies to every openai/codex ref. Refs without codex-rs/mxc-sandbox/Cargo.toml (older refs
      # allowed by Validate source_ref) are skipped. When the file exists, the script is idempotent
      # and exits 1 if its anchors are missing, so the build stops instead of building an unpatched graph.
      - name: Patch mxc-sdk out of the Android dependency graph (openai/codex)
        if: (inputs.source_repository || 'openai/codex') == 'openai/codex'
        run: |
          set -eu
          mxc_toml="source-repo/codex-rs/mxc-sandbox/Cargo.toml"
          if [ ! -f "$mxc_toml" ]; then
            echo "Skipped: $mxc_toml is not present in this ref; mxc-sdk patch is not needed"
            exit 0
          fi
          python3 "host-repo/scripts/patch-mxc-sdk-android.py" "$mxc_toml"
          git -C source-repo diff --stat -- codex-rs/mxc-sandbox/Cargo.toml

      - name: Patch reqwest TLS to rustls for Android cross-compile
        run: |
          set -eu
          WORKSPACE_CARGO="source-repo/codex-rs/Cargo.toml"
          if [ -f "$WORKSPACE_CARGO" ]; then
            python3 "host-repo/scripts/patch-reqwest-tls.py" "$WORKSPACE_CARGO"
          fi
          cd source-repo/codex-rs
          cargo fetch --target aarch64-linux-android
          echo "=== Cargo.lock diff after cargo fetch (see /tmp/cargo-lock-diff.txt) ==="
          diff -u /tmp/cargo-lock-before.txt Cargo.lock > /tmp/cargo-lock-diff.txt || true
          wc -l /tmp/cargo-lock-diff.txt
          python3 "$GITHUB_WORKSPACE/host-repo/scripts/verify-cargo-lock-delta.py" \
            /tmp/cargo-lock-before.txt Cargo.lock
          set +e
          OUT=$(cargo tree --locked --target aarch64-linux-android -p codex-http-client -i openssl-sys \
            --format "{p} FEATURES=[{f}]" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: cargo tree failed for codex-http-client (exit $STATUS)" >&2
            exit 1
          fi
          echo "$OUT" | grep '^openssl-sys ' | head -1 | grep -q 'vendored' || {
            echo "ERROR: openssl-sys resolved for codex-http-client WITHOUT the vendored feature" >&2
            exit 1
          }

      - name: Diagnose openssl-sys dependency path
        run: |
          set -eu
          cd source-repo/codex-rs
          for pkg in codex-cli codex-exec codex-code-mode-host; do
            echo "=== openssl-sys FEATURES for $pkg ==="
            OUT=$(cargo tree --locked --target aarch64-linux-android -p "$pkg" -i openssl-sys \
              --format "{p} FEATURES=[{f}]" 2>&1) || { echo "openssl-sys not found in $pkg"; continue; }
            echo "$OUT"
            echo "$OUT" | grep '^openssl-sys ' | head -1 | grep -q 'vendored' || {
